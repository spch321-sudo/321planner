<script>
/* 語言導向：?lang= 指定 → 上次使用的語言 → 新使用者依手機語言 → 繁體 */
(function(){
  var M={tc:'tc.html',sc:'sc.html',en:'en.html'};
  var q=location.search||'',lang=null,m=/[?&]lang=(tc|sc|en)\b/.exec(q);
  if(m){lang=m[1];try{localStorage.setItem('p4_lang',JSON.stringify(lang));}catch(e){}}
  if(!M[lang]){try{var r=localStorage.getItem('p4_lang');lang=r?JSON.parse(r):null;}catch(e){lang=null;}}
  if(!M[lang]){
    var old=false;try{old=!!localStorage.getItem('p4_schema_ver');}catch(e){}
    if(old){lang='tc';}
    else{
      var n=String((navigator.languages&&navigator.languages[0])||navigator.language||'').toLowerCase();
      if(n.indexOf('zh')===0){lang=/hans|cn|sg|my/.test(n)?'sc':'tc';}
      else if(n){lang='en';}
      else{lang='tc';}
    }
  }
  var rest=q.replace(/([?&])lang=(tc|sc|en)&?/,'$1').replace(/[?&]$/,'');
  try{location.replace(M[lang]+rest+(location.hash||''));}catch(e){location.href=M[lang];}
})();
</script>
